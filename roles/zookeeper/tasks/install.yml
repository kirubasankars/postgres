---
- name: Create ZooKeeper group
  ansible.builtin.group:
    name: "{{ zookeeper_group }}"
    system: true
    state: present

- name: Create ZooKeeper user
  ansible.builtin.user:
    name: "{{ zookeeper_user }}"
    group: "{{ zookeeper_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ zookeeper_data_dir }}"
    create_home: false

- name: Create ZooKeeper directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ zookeeper_user }}"
    group: "{{ zookeeper_group }}"
    mode: "0755"
  loop:
    - "{{ zookeeper_install_dir }}"
    - "{{ zookeeper_data_dir }}"
    - "{{ zookeeper_log_dir }}"

- name: Download ZooKeeper binary tarball
  ansible.builtin.get_url:
    url: "{{ zookeeper_url }}"
    dest: "/tmp/{{ zookeeper_tarball }}"
    mode: "0644"
    timeout: 60

- name: Unpack ZooKeeper
  ansible.builtin.unarchive:
    src: "/tmp/{{ zookeeper_tarball }}"
    dest: "{{ zookeeper_install_dir }}"
    remote_src: true
    owner: "{{ zookeeper_user }}"
    group: "{{ zookeeper_group }}"
    creates: "{{ zookeeper_install_dir }}/apache-zookeeper-{{ zookeeper_version }}-bin"

- name: Point current symlink at this version
  ansible.builtin.file:
    src: "{{ zookeeper_install_dir }}/apache-zookeeper-{{ zookeeper_version }}-bin"
    dest: "{{ zookeeper_current_dir }}"
    state: link
    owner: "{{ zookeeper_user }}"
    group: "{{ zookeeper_group }}"
