---
# postgresql-common runs pg_createcluster during package install, which
# leaves an initdb'd cluster in PGDATA. Patroni only bootstraps an empty
# data directory, so every node would keep its own system identifier and
# the replicas could never stream from the elected primary. Disable that
# behaviour before the server package lands.
- name: Install postgresql-common ahead of the server
  ansible.builtin.apt:
    name: postgresql-common
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Stop postgresql-common from creating the main cluster
  ansible.builtin.lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: '^\s*#?\s*create_main_cluster\s*='
    line: "create_main_cluster = false"
    state: present

# postgresql-contrib is deliberately absent: the contrib modules ship inside
# postgresql-{{ postgresql_version }}, and the unversioned metapackage
# depends on postgresql-contrib-${default-version}, which would drag in a
# newer major release from PGDG.
- name: Install PostgreSQL server packages
  ansible.builtin.apt:
    name:
      - "{{ postgresql_package }}={{ postgresql_package_version }}"
      - python3-psycopg2
      - libpq-dev
    state: present
    update_cache: true
    cache_valid_time: 3600
    allow_downgrade: true

- name: Look for a pg_createcluster-managed main cluster
  ansible.builtin.stat:
    path: "{{ postgresql_config_dir }}/postgresql.conf"
  register: postgresql_packaged_cluster

# Patroni writes this file into PGDATA, so its presence means the cluster
# is already under Patroni control and must never be dropped.
- name: Look for an existing Patroni cluster
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/patroni.dynamic.json"
  register: postgresql_patroni_cluster

- name: Drop the packaged main cluster so Patroni can bootstrap
  ansible.builtin.command: >-
    pg_dropcluster --stop {{ postgresql_version }} main
  when:
    - postgresql_drop_packaged_cluster | bool
    - postgresql_packaged_cluster.stat.exists
    - not postgresql_patroni_cluster.stat.exists
  changed_when: true
