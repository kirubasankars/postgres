---
- name: Install OpenJDK 11 (Debian)
  ansible.builtin.apt:
    name: "{{ java_package_debian }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install OpenJDK 11 (RedHat)
  ansible.builtin.yum:
    name: "{{ java_package_redhat }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Record JAVA_HOME for later roles
  ansible.builtin.set_fact:
    java_home: "{{ java_home }}"
