---
- name: Install Patroni build dependencies
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-dev
      - python3-psycopg2
      - gcc
    state: present
  when: ansible_os_family == "Debian"

- name: Install Patroni and kazoo from PyPI
  ansible.builtin.pip:
    name:
      - "{{ patroni_package }}"
      - "{{ patroni_kazoo_package }}"
    extra_args: --upgrade
    executable: pip3

- name: Create Patroni config and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ patroni_user }}"
    group: "{{ patroni_group }}"
    mode: "0750"
  loop:
    - "{{ patroni_config_dir }}"
    - "{{ patroni_log_dir }}"
