---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH before enabling the firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow ZooKeeper client and peer ports from the cluster network
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    from_ip: "{{ cluster_network }}"
  loop:
    - "{{ zookeeper_client_port | default(2181) }}"
    - "{{ zookeeper_peer_port | default(2888) }}"
    - "{{ zookeeper_election_port | default(3888) }}"

- name: Allow PostgreSQL and Patroni REST from the cluster network
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    from_ip: "{{ cluster_network }}"
  loop:
    - "{{ postgresql_port | default(5432) }}"
    - "{{ patroni_rest_port | default(8008) }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
