---
- name: Tune kernel for database and ZooKeeper workloads
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: vm.swappiness, value: "1" }
    - { key: vm.overcommit_memory, value: "2" }
    - { key: net.core.somaxconn, value: "4096" }
    - { key: net.ipv4.tcp_keepalive_time, value: "60" }
    - { key: net.ipv4.tcp_keepalive_intvl, value: "10" }
    - { key: net.ipv4.tcp_keepalive_probes, value: "6" }
    - { key: fs.file-max, value: "2097152" }
