---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install base packages (RedHat)
  ansible.builtin.yum:
    name: "{{ common_packages }}"
    state: present
  when: ansible_os_family == "RedHat"
