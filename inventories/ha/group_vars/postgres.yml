---
# PostgreSQL / Patroni settings for the postgres inventory group.
# Replace passwords before a real deploy; prefer ansible-vault.

# 14.6 released 2022-11-10 — current 14 minor as of this commit.
postgresql_version: 14
postgresql_full_version: "14.6"
postgresql_port: 5432
postgres_max_connections: 200
postgres_shared_buffers: 256MB

postgres_superuser: postgres
postgres_superuser_password: change-me-superuser
postgres_replicator_user: replicator
postgres_replicator_password: change-me-replicator

patroni_scope: "{{ cluster_name }}"
patroni_namespace: "{{ cluster_namespace }}"
patroni_ttl: 30
patroni_loop_wait: 10
patroni_retry_timeout: 10
patroni_maximum_lag_on_failover: 1048576
