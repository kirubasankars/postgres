---
# Three Linux VMs. Each host is both a ZooKeeper voter and a
# PostgreSQL / Patroni member.
all:
  children:
    zookeeper:
      hosts:
        pg-zk-01:
          ansible_host: 10.20.30.11
        pg-zk-02:
          ansible_host: 10.20.30.12
        pg-zk-03:
          ansible_host: 10.20.30.13
    postgres:
      hosts:
        pg-zk-01:
        pg-zk-02:
        pg-zk-03:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
