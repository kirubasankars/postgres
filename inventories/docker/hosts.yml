---
# The docker/compose.yaml lab. Ansible talks to each container with
# docker exec instead of SSH, so ansible_host stays at the inventory
# name: the docker connection plugin reads it as the container name.
# Peers still find each other on 10.20.30.0/24, which compose assigns.
all:
  children:
    zookeeper:
      hosts:
        pg-zk-01:
        pg-zk-02:
        pg-zk-03:
    postgres:
      hosts:
        pg-zk-01:
        pg-zk-02:
        pg-zk-03:
  vars:
    ansible_connection: community.docker.docker
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
