---
- name: Deploy PostgreSQL streaming replication via Patroni
  hosts: postgres
  become: true
  any_errors_fatal: true
  roles:
    - role: common
    - role: postgresql
    - role: patroni
  post_tasks:
    - name: Wait for Patroni REST API
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}:{{ patroni_rest_port }}/health"
        status_code: [200, 503]
      register: patroni_health
      retries: 30
      delay: 4
      until: patroni_health.status in [200, 503]
